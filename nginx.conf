server {
    # Must run on 8080 (or higher) because unprivileged Nginx cannot bind to port 80
    listen 8080;
    
    # This matches the COPY command in your Stage 2 Dockerfile
    root /usr/share/nginx/html;
    index index.html;

    # Crucial for Single Page Applications (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets to improve performance
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}