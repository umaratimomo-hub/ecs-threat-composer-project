name: 6.Application Deploy

on:
  workflow_dispatch:

# on:
#   push:
#     branches:
#       - main
#     paths:
#       - 'app/**'       # Monitors all application source files
#       - 'Dockerfile'   # Monitors Docker build recipe changes
#       - 'nginx.conf'   # Monitors Nginx routing configuration changes

# Required for OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER_NAME }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE_NAME }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

jobs:
  # JOB 1: Check if the infrastructure exists and build the image
  build-and-prep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      # 1. STATIC ANALYSIS: Catch Dockerfile issues before building
      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # GUARDRAIL 1: Automated Infrastructure Check
      - name: Verify AWS Infrastructure Exists
        run: |
          echo "Verifying target ECS cluster and service..."
          if ! aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            | grep -q "ACTIVE"; then
              echo "ERROR: Target ECS Infrastructure is missing or inactive!"
              echo "DevOps team must run the infra-deploy workflow first."
              exit 1
          fi
          echo "Infrastructure verified successfully."

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 2. BUILD: Create the image locally, but do not push yet
      - name: Build image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .

      # 3. VULNERABILITY SCANNING: Check the actual image artifact
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # 4. PUSH TO REGISTRY: Only executes if Trivy passes the exit-code check
      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  # JOB 2: The Production Deployment (Requires DevOps sign-off)
  deploy-to-prod:
    runs-on: ubuntu-latest
    needs: build-and-prep
    environment: production # GUARDRAIL 2: Triggers the human approval gate
    
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force ECS Deployment to Latest Revision
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

