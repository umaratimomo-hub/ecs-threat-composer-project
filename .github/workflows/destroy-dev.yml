name: Destroy Main Infrastructure (Manual)

# 1. Manual only, requiring explicit text input
on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type DESTROY to confirm you want to tear down infra'
        required: true
        type: string

permissions:
  id-token: write   # Required for requesting the JWT to authenticate with AWS
  contents: read    # Required for actions/checkout

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  AWS_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    
    # 2. Hardcode the directory so other folders are not accessed
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Confirmation Phrase
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "Confirmation failed. You must type DESTROY exactly."
            exit 1
          fi
          echo "Confirmation accepted. Proceeding with destruction."

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Initialize the S3 backend using the environment variables
      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve -input=false \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="domain_name=anaqahwear.com"
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      # Force destroy to run headless without asking for confirmation
      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false -var="project_name=${{ env.PROJECT_NAME }}"