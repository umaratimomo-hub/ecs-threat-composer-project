name: 2. Infrastructure Lifecycle (Terraform)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'infra/**'
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: 'plan'
      confirm_destroy:
        description: 'Safety Catch (ONLY if destroying): Type "DESTROY" to confirm'
        required: false
        type: string
        default: ''

permissions:
  id-token: write      # Required for AWS OIDC authentication
  contents: read       # Required for actions/checkout
  pull-requests: write # Required to post plan output as a PR comment

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

jobs:
  terraform:
    name: Infrastructure Automation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Safety catch for destroy action
      - name: Verify Teardown Confirmation
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' && github.event.inputs.confirm_destroy != 'DESTROY'
        run: |
          echo "ERROR: Confirmation failed. You must type DESTROY to tear down the infrastructure."
          exit 1

      # Linting & Security Scans
      - name: Setup TFLint
        if: github.event.inputs.action != 'destroy'
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint
        if: github.event.inputs.action != 'destroy'
        run: |
          tflint --init
          tflint -f compact --minimum-failure-severity=error

      - name: Run Trivy Vulnerability Scanner
        if: github.event.inputs.action != 'destroy'
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'config'
          scan-ref: 'infra'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Formatting
        if: github.event.inputs.action != 'destroy'
        run: terraform fmt -check -recursive

      # Authenticate to AWS via OIDC
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Validate Configuration
        if: github.event.inputs.action != 'destroy'
        run: terraform validate

      # ==========================================
      # PLAN LOGIC
      # ==========================================
      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply')) || (github.event_name == 'push' && github.event.inputs.action == null)
        run: terraform plan -no-color -input=false -var="project_name=${{ env.PROJECT_NAME }}" -var="domain_name=anaqahwear.com"

      - name: Update Pull Request with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # ==========================================
      # APPLY LOGIC
      # ==========================================
      - name: Terraform Apply
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve -input=false -var="project_name=${{ env.PROJECT_NAME }}" -var="domain_name=anaqahwear.com"

      # ==========================================
      # DESTROY LOGIC
      # ==========================================
      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false -var="project_name=${{ env.PROJECT_NAME }}" -var="domain_name=anaqahwear.com"