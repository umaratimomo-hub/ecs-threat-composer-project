name: 1. Workflow Linting (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-workflows:
    name: Actionlint and Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true