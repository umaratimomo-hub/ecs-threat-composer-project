name: 'Terraform Infra Deploy'

on:
  workflow_dispatch: # Manual trigger

permissions:
  id-token: write   # Required for OIDC
  contents: read

jobs:
  validate-and-plan:
    name: 'Validate and Plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra # <--- NOTE: Ensure this matches your directory name!
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::526644151787:role/github-actions-terraform-role
          aws-region: eu-north-1
      
      - name: Terraform Init
        run: terraform init
      
      # Include your TFLint and Trivy steps here as discussed before...
      
      - name: Terraform Plan
        run: terraform plan -input=false

  deploy:
    name: 'Deploy Infrastructure'
    needs: validate-and-plan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::526644151787:role/github-actions-terraform-role
          aws-region: eu-north-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

