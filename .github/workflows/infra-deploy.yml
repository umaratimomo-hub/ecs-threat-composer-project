name: Infrastructure Deploy

# 1. Triggers on merges to main (only for infra changes) OR manual clicks
on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch: 

permissions:
  id-token: write   # Required to securely request the JWT from GitHub
  contents: read

jobs:
  deploy:
    name: Apply Infrastructure
    runs-on: ubuntu-latest
    
    # 2. Ensures all commands run inside your Terraform folder
    defaults:
      run:
        working-directory: infra
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Authenticate with AWS via your OIDC role
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::526644151787:role/github-actions-terraform-role
          aws-region: eu-north-1

      # 4. Initialize the S3 backend
      - name: Terraform Init
        run: terraform init

      # 5. Execute the deployment! 
      # (-auto-approve is safe here because PRs are strictly reviewed via infra-ci.yml)
      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

