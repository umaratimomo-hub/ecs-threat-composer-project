name: Infrastructure Deploy

# 1. Triggers on merges to main (only for infra changes) OR manual clicks
on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch: 

permissions:
  id-token: write   # Required to securely request the JWT from GitHub
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  AWS_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
  #F_LOG: DEBUG

jobs:
  deploy:
    name: Apply Infrastructure
    runs-on: ubuntu-latest
    
    # 2. Ensures all commands run inside your Terraform folder
    defaults:
      run:
        working-directory: infra
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Authenticate with AWS via your OIDC role
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. Initialize the S3 backend
      # Force init to fail if variables are missing instead of stalling
      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Validate Configuration
        run: terraform validate

      # Force plan to fail if inputs are missing
      - name: Terraform Plan
        run: terraform plan -input=false -no-color -var="project_name=${{ env.PROJECT_NAME }}"

      # Force apply to run headless
      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -var="project_name=${{ env.PROJECT_NAME }}"

