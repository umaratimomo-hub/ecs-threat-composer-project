name: Infrastructure Deploy

# 1. Triggers on merges to main (only for infra changes) OR manual clicks
on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch: 

permissions:
  id-token: write   # Required to securely request the JWT from GitHub
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  AWS_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

jobs:
  deploy:
    name: Apply Infrastructure
    runs-on: ubuntu-latest
    
    # 2. Ensures all commands run inside your Terraform folder
    defaults:
      run:
        working-directory: infra
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- TFLINT ---
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint
        run: |
          tflint --init
          # Only fail the pipeline on Errors, let Warnings pass
          tflint -f compact --minimum-failure-severity=error

      # --- TRIVY ---
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'config'
          scan-ref: 'infra'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # --- INFRA DEPLOYMENT ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Authenticate with AWS via your OIDC role
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. Initialize the S3 backend
      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Validate Configuration
        run: terraform validate

      # Force plan to fail if inputs are missing
      - name: Terraform Plan
        run: terraform plan -input=false -no-color -var="project_name=${{ env.PROJECT_NAME }}" -var="domain_name=anaqahwear.com"

      # Force apply to run headless
      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -var="project_name=${{ env.PROJECT_NAME }}" -var="domain_name=anaqahwear.com"

