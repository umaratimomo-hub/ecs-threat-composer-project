name: Infrastructure Bootstrap

on:
  workflow_dispatch: # Allows manual triggering only from the GitHub Actions UI

# 1. Required permissions for OIDC authentication
permissions:
  id-token: write
  contents: read

env:
  env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
  S3_BUCKET_NAME: ${{ vars.TF_STATE_BUCKET }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate securely via OIDC instead of access keys
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create S3 Bucket for Terraform State
        run: |
          echo "Creating S3 bucket: ${{ env.S3_BUCKET_NAME }}..."
          aws s3api create-bucket \
            --bucket ${{ env.S3_BUCKET_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}

      - name: Enable S3 Bucket Versioning
        run: |
          echo "Enabling versioning on bucket to track state history..."
          aws s3api put-bucket-versioning \
            --bucket ${{ env.S3_BUCKET_NAME }} \
            --versioning-configuration Status=Enabled

      - name: Block All Public Access to State Bucket
        run: |
          echo "Blocking public access to keep state files secure..."
          aws s3api put-public-access-block \
            --bucket ${{ env.S3_BUCKET_NAME }} \
            --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"