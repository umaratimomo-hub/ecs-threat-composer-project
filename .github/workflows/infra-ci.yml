name: Terraform CI (Verify & Speculative Plan)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'

permissions:
  id-token: write   # Required for requesting the JWT to authenticate with AWS via OIDC
  contents: read    # Required for actions/checkout
  pull-requests: write # Required to post the terraform plan as a PR comment

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}

jobs:
  validate-and-plan:
    name: Lint, Validate, and Plan
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      
       # --- TFLINT ---
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint
        run: |
          tflint --init
          tflint -f compact

      # --- TRIVY ---
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'config'
          scan-ref: 'infra'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Formatting
        run: terraform fmt -check -recursive

      # Authenticate to AWS BEFORE initializing Terraform
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # A single, clean initialization using your S3 backend
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Validate Configuration
        run: terraform validate

      # Run the plan and save the output
      - name: Speculative Plan
        id: plan
        run: terraform plan -no-color -input=false -var="project_name=${{ env.PROJECT_NAME }}"

      # Optional but highly recommended: Post the plan to the PR
      - name: Update Pull Request with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
            
            <details><summary>Show Plan</summary>
            
            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })