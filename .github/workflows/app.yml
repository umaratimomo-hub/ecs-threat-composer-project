name: 3. Application Lifecycle (App & Container)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'nginx.conf'
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'nginx.conf'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER_NAME }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE_NAME }}

jobs:
  ci-and-build:
    name: Application CI & Container Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Run Application Tests
        run: |
          echo "Running application unit tests..."

      - name: Configure AWS Credentials via OIDC
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Infrastructure Exists
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLUSTER: ${{ env.ECS_CLUSTER }}
          SERVICE: ${{ env.ECS_SERVICE }}
          REGION: ${{ env.AWS_REGION }}
        run: |
          echo "Verifying target ECS cluster and service..."
          if ! aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "$REGION" \
            | grep -q "ACTIVE"; then
            echo "ERROR: Target ECS Infrastructure is missing or inactive!"
            exit 1
          fi
          echo "Infrastructure verified successfully."

      - name: Log in to Amazon ECR
        id: login-ecr
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        id: build-image
        env:
          EVENT_NAME: ${{ github.event_name }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ env.ECR_REPOSITORY }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            TAG="test-build:latest"
          else
            TAG="$REGISTRY/$REPO:latest"
          fi
          echo "Building image tagged as $TAG..."
          docker build -t "$TAG" .
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.build-image.outputs.image_tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push image to Amazon ECR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: docker push "${{ steps.build-image.outputs.image_tag }}"

  deploy-to-ecs:
    name: Deploy to ECS (DevOps Clearance)
    runs-on: ubuntu-latest
    needs: ci-and-build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force ECS Deployment to Latest Revision
        env:
          CLUSTER: ${{ env.ECS_CLUSTER }}
          SERVICE: ${{ env.ECS_SERVICE }}
          REGION: ${{ env.AWS_REGION }}
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            --region "$REGION"