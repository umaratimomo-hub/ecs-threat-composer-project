name: Application CI (PR Check)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'       # Only trigger on application code changes
      - 'Dockerfile'   # Or if the build recipe changes
      - 'nginx.conf'   # Or if the routing configuration changes

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- GATE 1: DOCKERFILE LINTING ---
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # Fails the pipeline only if an 'error' level rule is broken 
          # (e.g., running as root, missing tags)
          failure-threshold: error 

      # --- APPLICATION TESTS ---
      - name: Run Application Tests
        run: |
          echo "Running unit tests..."
          # cd app
          # npm install
          # npm test

      # --- BUILD THE IMAGE ---
      - name: Build Docker Image
        run: |
          echo "Compiling the Docker image locally..."
          docker build -t test-build:latest .

      # --- GATE 2: IMAGE VULNERABILITY SCAN ---
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: 'test-build:latest'
          format: 'table'
          exit-code: '1'
          # Only fail the pipeline if there is an actual patch available
          ignore-unfixed: true 
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'